---
stages:
  - build

variables:
  DOCKER_REGISTRY_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}
  DOCKERFILE: "Dockerfile"
  # Temp tag keyed on the commit SHA so it is stable across the branch
  # pipeline that builds it and the tag pipeline that retags it. Pipeline
  # ID is not stable: a git tag triggers a new pipeline with a new ID.
  TEMP_IMAGE_TAG: "TEMP_${CI_COMMIT_SHORT_SHA}"

# Build the image on branch/MR pipelines and push it with the temp tag.
# Skipped on tag pipelines, which retag the existing temp image instead.
build_push_image:
  stage: build
  image: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:git"
  services:
    - name: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:dind"
      alias: docker
  variables:
    # Keep BuildKit OFF for this build+tag+push flow. With BuildKit on,
    # `docker build` leaves layers in BuildKit's own cache rather than fully
    # materializing them into the daemon image store, so the subsequent
    # `docker tag` / `docker push` can reference layer blobs that were never
    # loaded for push -- surfacing as "blob unknown to registry". The classic
    # builder materializes every layer into the daemon store before push.
    DOCKER_BUILDKIT: "0"
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "wma/vizlab" && $CI_COMMIT_TAG == null'
  script:
    # Build an image and push it to the registry with tag TEMP_<commit sha>
    - >-
      DOCKER_REGISTRY_IMAGE=$(echo "$DOCKER_REGISTRY_IMAGE" |
      tr '[:upper:]' '[:lower:]')
    - >-
      echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}"
      --password-stdin $CI_REGISTRY
    - echo "${DOCKERFILE}"
    - docker pull ${DOCKER_REGISTRY_IMAGE}:latest || true
    - >-
      docker build --build-arg ARTIFACTORY_HOSTNAME
      --cache-from ${DOCKER_REGISTRY_IMAGE}:latest .
      -t "${DOCKER_REGISTRY_IMAGE}:${TEMP_IMAGE_TAG}" -f "${DOCKERFILE}"
    - >-
      docker tag "${DOCKER_REGISTRY_IMAGE}:${TEMP_IMAGE_TAG}"
      "${DOCKER_REGISTRY_IMAGE}:latest"
    # Images whose tags start with "TEMP_" are periodically cleaned up by the
    # Container Registry Tag Expiration Policy.
    - docker push --all-tags "${DOCKER_REGISTRY_IMAGE}"

# On tag pipelines, retag the temp image built for this commit as the
# release tag rather than rebuilding it from scratch.
retag_image:
  stage: build
  image: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:git"
  services:
    - name: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:dind"
      alias: docker
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "wma/vizlab" && $CI_COMMIT_TAG'
  script:
    - >-
      DOCKER_REGISTRY_IMAGE=$(echo "$DOCKER_REGISTRY_IMAGE" |
      tr '[:upper:]' '[:lower:]')
    - >-
      echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}"
      --password-stdin $CI_REGISTRY
    # Pull the temp image built for this commit by the branch pipeline and
    # retag it with the release tag instead of rebuilding.
    - docker pull "${DOCKER_REGISTRY_IMAGE}:${TEMP_IMAGE_TAG}"
    - >-
      docker tag "${DOCKER_REGISTRY_IMAGE}:${TEMP_IMAGE_TAG}"
      "${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    - docker push "${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
