stages:
  - build

variables:
  DOCKER_REGISTRY_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}
  DOCKERFILE: "Dockerfile"

build_push_image:
  stage: build
  #image: "${INTERNAL_DOCKER_MIRROR_URL}docker:git"
  image: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:git"
  services:
    - name: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:dind"
      alias: docker
  variables:
    # Use BuildKit so registry cache references stay consistent with the blobs
    # actually pushed. The classic builder combined with --cache-from can
    # reference cached layers that are not present in the registry (expired or
    # GC'd), producing "blob unknown to registry" on push.
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "wma/vizlab"'
  script:
    # Build an image and push it to the registry with tag TEMP_<pipeline number>
    - DOCKER_REGISTRY_IMAGE=$(echo "$DOCKER_REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin $CI_REGISTRY
    - echo "${DOCKERFILE}"
    - docker pull ${DOCKER_REGISTRY_IMAGE}:latest || true
    # --pull refreshes the base image; BUILDKIT_INLINE_CACHE=1 embeds cache
    # metadata into the pushed image so --cache-from only references blobs that
    # actually exist in the registry.
    - docker build --pull --build-arg ARTIFACTORY_HOSTNAME --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from ${DOCKER_REGISTRY_IMAGE}:latest . -t "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}" -f "${DOCKERFILE}"
    - docker tag "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}" "${DOCKER_REGISTRY_IMAGE}:latest"
    #we could set this up:
    # Images whose tags start with "TEMP_" are periodically cleaned up by the Container Registry Tag Expiration Policy:
    # https://code.chs.usgs.gov/wma/osd/nwisra/aqcu-lookups/-/settings/ci_cd
    # also push the corresponding docker tag set in "variables" if it exists
    - if [ -n "${CI_COMMIT_TAG}" ]; then docker tag "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}" "${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"; fi
    - docker push --all-tags "${DOCKER_REGISTRY_IMAGE}"
