stages:
  - build

variables:
  DOCKER_REGISTRY_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}
  DOCKERFILE: "Dockerfile"

build_push_image:
  stage: build
  #image: "${INTERNAL_DOCKER_MIRROR_URL}docker:git"
  image: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:git"
  services:
    - name: "${ARTIFACTORY_HOSTNAME}/docker-official-mirror/docker:dind"
      alias: docker
  variables:
    # Keep BuildKit OFF for this build+tag+push flow. With BuildKit on,
    # `docker build` leaves layers in BuildKit's own cache rather than fully
    # materializing them into the daemon image store, so the subsequent
    # `docker tag` / `docker push` can reference layer blobs that were never
    # loaded for push -- surfacing as "blob unknown to registry". The classic
    # builder materializes every layer into the daemon store before push.
    DOCKER_BUILDKIT: "0"
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "wma/vizlab"'
  script:
    # Build an image and push it to the registry with tag TEMP_<pipeline number>
    - DOCKER_REGISTRY_IMAGE=$(echo "$DOCKER_REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin $CI_REGISTRY
    - echo "${DOCKERFILE}"
    # --pull refreshes the base image so a stale/partial local base layer can't
    # leave the registry missing a blob the pushed manifest points to.
    - docker build --pull --build-arg ARTIFACTORY_HOSTNAME . -t "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}" -f "${DOCKERFILE}"
    - docker tag "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}" "${DOCKER_REGISTRY_IMAGE}:latest"
    #we could set this up:
    # Images whose tags start with "TEMP_" are periodically cleaned up by the Container Registry Tag Expiration Policy:
    # https://code.chs.usgs.gov/wma/osd/nwisra/aqcu-lookups/-/settings/ci_cd
    # also push the corresponding docker tag set in "variables" if it exists
    - if [ -n "${CI_COMMIT_TAG}" ]; then docker tag "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}" "${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"; fi
    # Push tags one at a time. --all-tags fans out concurrent uploads that can
    # partially fail against a proxied registry; explicit sequential pushes make
    # each upload complete (and fail loudly) on its own.
    - docker push "${DOCKER_REGISTRY_IMAGE}:TEMP_${CI_PIPELINE_ID}"
    - docker push "${DOCKER_REGISTRY_IMAGE}:latest"
    - if [ -n "${CI_COMMIT_TAG}" ]; then docker push "${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"; fi
